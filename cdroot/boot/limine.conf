wallpaper: boot():/boot/wallpaper.jpg
wallpaper_style: stretched
term_margin: 0
term_margin_gradient: 0

timeout: 30

/DIOS - Graphics mode
    protocol: limine
    path: boot():/boot/kernel64.bin
    cmdline: livecd gfx
    module_path: boot():/boot/rootfs.tar
    module_path: boot():/boot/limine-bios-hdd.bin

/DIOS - Kernel shell
    protocol: limine
    path: boot():/boot/kernel64.bin
    cmdline: livecd
    module_path: boot():/boot/rootfs.tar
    module_path: boot():/boot/limine-bios-hdd.bin
